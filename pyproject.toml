[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemetro"
version = "0.1.0"
description = "Gemetro Digital pipeline package"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "openpyxl",
    "scikit-learn",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
